name: CI

on:
  push:
    branches: [main]
  pull_request:

# 最小限のトークンスコープ: ここにある全ジョブはリポジトリを読み取るだけ
# (checkout + scan + build)。ワークフローが不要な書き込み権限を継承しないよう
# 明示的に設定している。ジョブが後で権限を必要とする場合のみ、より狭い
# per-job 権限を付与すること。
permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      # gitleaks-action は組織所有のリポジトリ(traPtitech は org)に対しては
      # リポジトリの公開/非公開に関わらず有料の GITLEAKS_LICENSE を要求する
      # ため、代わりに OSS の CLI を直接実行する -- pre-commit フックが
      # ローカルで使うのと同じツールで、ライセンスは不要。
      #
      # コンテナは root で実行され、ワークスペースは runner ユーザーの
      # 所有物であるため、env 経由で safe.directory 設定を注入しないと
      # git がリポジトリの読み取りを拒否する -- しかもそれはエラーにならず
      # 静かに失敗する: gitleaks は "0 commits scanned, no leaks found" と
      # 報告し、実際には何もスキャンしていないのに正常終了したように見える。
      #
      # イメージは可変なタグではなく、コンテンツアドレス方式のダイジェストで
      # 固定している(actions/*@<commit-sha> と同じ理由)。ダイジェストの
      # 更新は次のコマンドで行う:
      #   docker buildx imagetools inspect ghcr.io/gitleaks/gitleaks:v8.30.1
      #
      # (上の fetch-depth: 0 により) git の全履歴をスキャンする。これは
      # pre-commit フックをスキップ/回避した人向けの最終防衛ラインだから。
      # ローカルフックはステージされた変更のみをスキャンし(`--staged
      # --pre-commit`、--verbose なし)、コミットのたびに実行されるため
      # 高速さを保つ必要がある。
      - uses: docker://ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /github/workspace
        with:
          args: git --redact --verbose --no-banner /github/workspace

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Knip
        # knip は解析のために drizzle.config.ts をインポートするが、これは
        # DATABASE_URL 未設定だと例外を投げるようになった(packages/db/
        # drizzle.config.ts 参照) -- ここでは実際に接続しないため、
        # ダミー値で十分。
        env:
          DATABASE_URL: mysql://user:pass@localhost:3306/checkin
        run: pnpm knip

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
