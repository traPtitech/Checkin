version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
    ignore:
      # @types/node のメジャーバージョンは Node.js のメジャーバージョンに合わせて手動で更新する
      # (minor/patch は型定義の追加・修正のみで Node.js 側のバージョンとは対応しないため自動更新を許可する)
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
