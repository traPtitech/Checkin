packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  unrs-resolver: true
  # postinstall は shell 補完の案内を1行出すだけで、補完の導入自体は
  # `openspec completion install` を実行したときにしか行われない。
  # 生成物が無いので、実行しなくても lint・型チェック・テスト・ビルドに影響しない。
  '@fission-ai/openspec': false
  # postinstall は導入済みの Vue のメジャーバージョンを見て lib/index.* を
  # そのバージョン用のものに差し替える。現在の配布物は差し替え前から Vue 3 用と
  # 同じ内容だが、それは今の公開物がたまたまそうなっているだけで、
  # vue-demi が保証している挙動ではない。Vue のメジャーバージョンが上がったときに
  # 気付かないまま合わない shim を使うことがないよう、差し替えを実行させる。
  vue-demi: true


# @nuxt/ui 3.3.7 の配下にある @nuxt/fonts("^3.17.3")・@nuxt/icon("^3.17.5")・
# @nuxtjs/color-mode("^3.13.2") が @nuxt/kit の v3 を要求しており、`nuxt` が
# 固定している v4 と並存する。pnpm はこれらを別々の peer-dependency
# インスタンスとして解決するため、@nuxt/kit が 2つのメジャーバージョンで
# 存在することになる -- これがサーバールートでの ESLint の型を考慮した
# チェックの失敗として表面化する(2つのインスタンスが異なる `h3` の型を
# 解決するため)。下の `nuxt` の固定バージョンに合わせて単一バージョンに
# 強制する。
#
# このオーバーライドは `nuxt` を上げるたびに同じバージョンへ手で追随させること。
# 追随しないと `nuxt prepare` が @nuxt/kit の export が無いと言って落ちる。
# 連動を強制する仕組みは無い。
#
# @nuxt/kit の v3 を要求する配下が無くなったら、このオーバーライドは削除すること
# (`pnpm why @nuxt/kit --recursive` で、このオーバーライドなしでも
# "Found 1 version" になることを確認する。インスタンスの数ではなく
# バージョンの数で判定する)。@nuxt/ui を 4 系へ上げると上の 3つが
# 入れ替わるので、そこが削除できる候補になる。
overrides:
  '@nuxt/kit': 4.5.2
